name: Build TWRP - Infinix X657 (Branch A)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
    - name: Checkout
      uses: actions/checkout@v2

    - name: Cleanup Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison gperf build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip bc
        sudo rm -rf /usr/share/dotnet /etc/mysql /usr/local/lib/android
        docker rmi $(docker images -q)

    - name: Install Repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo

    - name: Initialize TWRP Source
      run: |
        export PATH=$PATH:~/bin
        mkdir work
        cd work
        repo init --depth=1 -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-10.0
        repo sync -j$(nproc --all)

    - name: Clone Device Tree (Branch A)
      run: |
        cd work
        # Cloning specifically branch 'a' into the build directory
        git clone -b a https://github.com/Abducoffee/android_device_infinix_Infinix-X657.git device/infinix/Infinix-X657

    - name: Build Recovery
      run: |
        export PATH=$PATH:~/bin
        cd work
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        # Using the lunch combo for your device
        lunch omni_Infinix-X657-eng
        mka recoveryimage -j$(nproc --all)

    - name: Upload TWRP Build
      uses: actions/upload-artifact@v2
      with:
        name: TWRP-X657-BranchA
        path: work/out/target/product/Infinix-X657/recovery.img
